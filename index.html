<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12203d"><title>EXAM STRATEGY</title>
<style>
:root{--navy:#12203d;--blue:#243e6a;--gold:#f2bd45;--bg:#f3f5fa;--ink:#17233c;--muted:#7c879c;--line:#e6eaf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:var(--navy);color:white;padding:22px 15px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 28px}.logo{width:43px;height:43px;border-radius:13px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:18px}.brand b{font-size:14px;letter-spacing:.5px}.brand small{display:block;color:#aebbd0;font-size:9px;letter-spacing:1.5px;margin-top:4px}.nav{display:grid;gap:6px}.nav button,.logout{border:0;background:none;color:#c4cee0;text-align:left;padding:13px 12px;border-radius:10px;font-weight:600}.nav button.active,.nav button:hover{background:#2b4166;color:white}.bottom{margin-top:auto;border-top:1px solid #334462;padding-top:14px}.logout{width:100%}.main{margin-left:245px;min-height:100vh;display:flex;flex-direction:column}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.top small{color:var(--muted)}.content{width:100%;max-width:1200px;margin:auto;padding:28px 30px;flex:1}.hero{border-radius:20px;background:linear-gradient(115deg,#14213d,#2b4b7c);color:white;padding:32px 36px;display:flex;justify-content:space-between;align-items:center;min-height:220px}.eyebrow{color:var(--gold);font-size:10px;font-weight:bold;letter-spacing:2px}.hero h1{font-size:38px;line-height:1.1;margin:12px 0}.hero h1 span{color:var(--gold)}.hero p{color:#d1d9e7;font-size:13px}.hero .cap{font-size:76px;color:var(--gold);opacity:.8}.btn{border:0;background:var(--navy);color:white;border-radius:9px;padding:12px 16px;font-weight:bold}.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:white;color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:20px 0 28px}.stat,.tile,.card,.panel,.question,.result{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.stat strong{display:block;font-size:24px}.stat small{color:var(--muted);font-size:11px}.section{font-size:19px;margin:25px 0 13px}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.tile{border:1px solid var(--line);text-align:left;color:var(--ink);font-weight:bold}.tile span{display:block;color:#a77b1d;font-size:23px;margin-bottom:10px}.tile small{display:block;color:var(--muted);font-weight:normal;margin-top:8px}.pagehead{margin-bottom:20px}.pagehead h1{font-size:27px;margin:0 0 5px}.pagehead p{color:var(--muted);font-size:13px;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card h3{margin:12px 0 7px}.card p{color:var(--muted);font-size:13px;min-height:30px}.tag{display:inline-block;background:#fff3d3;color:#93680e;border-radius:20px;padding:6px 9px;font-size:9px;font-weight:bold;letter-spacing:1px}.empty{grid-column:1/-1;text-align:center;padding:35px;background:white;border:1px dashed #ccd4e2;border-radius:13px;color:var(--muted)}.form{display:grid;gap:12px;max-width:700px}.form label{display:grid;gap:6px;font-size:12px;font-weight:bold;color:#4e5b70}.form input,.form textarea,.form select,.login input{width:100%;padding:12px;border:1px solid #dfe4ed;border-radius:9px;background:white}.form textarea{min-height:70px}.question{margin-bottom:12px}.question label{display:block;padding:9px;font-size:13px}.question input{margin-right:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.result{display:flex;justify-content:space-between;margin-bottom:9px}.result small{display:block;color:var(--muted);margin-top:5px}.result strong{color:#148052;font-size:20px}.notice{background:#e7f6ed;color:#147346;padding:12px;border-radius:9px;margin-bottom:14px;font-size:13px}.loginwrap{position:fixed;inset:0;background:#0b1730cc;display:grid;place-items:center;padding:15px;z-index:10}.login{background:white;padding:27px;border-radius:18px;width:min(100%,390px);display:grid;gap:12px}.login h2{margin:0}.login p{color:var(--muted);font-size:12px}.hidden{display:none!important}footer{text-align:center;color:#9aa3b2;font-size:10px;padding:18px;border-top:1px solid var(--line)}.hamb{display:none}
@media(max-width:950px){.tiles{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.sidebar{width:245px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamb{display:inline-block;border:0;background:white;font-size:20px}.top{padding:0 15px}.content{padding:18px 14px}.hero{padding:24px;min-height:190px}.hero h1{font-size:29px}.hero .cap{display:none}.tiles{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.stat{padding:13px}}
</style></head>
<body><div class="layout">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">ES</div><div><b>EXAM STRATEGY</b><small>LEARN • PRACTICE • SUCCEED</small></div></div><nav class="nav" id="nav"></nav><div class="bottom"><div id="userlabel" style="font-size:12px;color:#c5d0e1;padding:8px">Guest student</div><button class="logout" onclick="logout()">↪ &nbsp; Logout</button></div></aside>
<main class="main"><header class="top"><div><button class="hamb" onclick="document.querySelector('#sidebar').classList.toggle('open')">☰</button> <small>Welcome to</small> <b> EXAM STRATEGY</b></div><button class="btn" type="button" id="loginbtn">Student Login</button></header><div class="content" id="content"></div><footer>© 2026 EXAM STRATEGY · Assam Competitive Exam Preparation</footer></main></div>
<div class="loginwrap hidden" id="loginwrap"><form class="login" id="loginform"><div class="logo">ES</div><h2>Student Login</h2><p>Demo mode: enter your name and email to continue on this device. Use Chrome to open this app, not a file preview.</p><input id="loginname" placeholder="Your name" required><input id="loginemail" type="email" placeholder="Email address" required><button class="btn">Continue</button><button type="button" class="btn light" id="cancelLogin">Cancel</button></form></div>
<script>
const ADMIN_EMAIL="contact.examstrategy@gmail.com";
let user=JSON.parse(localStorage.getItem("es_user")||"null"), tab="home", activeTest=null, answers={};
let data=JSON.parse(localStorage.getItem("es_data")||'{"ebooks":[],"classes":[],"live":[],"tests":[],"results":[]}');
const navItems=[["home","⌂","Dashboard"],["classes","▣","Online Classes"],["tests","▤","Mock Tests"],["ebooks","▧","Ebooks PDF"],["live","◉","Live Classes"],["results","🏆","My Results"],["admin","⚙","Admin Panel"]];
function save(){localStorage.setItem("es_data",JSON.stringify(data))}
function isAdmin(){return user&&user.email.toLowerCase()===ADMIN_EMAIL}
function openLogin(){document.querySelector("#loginwrap").classList.remove("hidden")}
function closeLogin(){document.querySelector("#loginwrap").classList.add("hidden")}
function login(e){
 e.preventDefault();
 try {
  const name=document.querySelector("#loginname").value.trim();
  const email=document.querySelector("#loginemail").value.trim();
  if(!name || !email || !email.includes("@")) throw new Error("Please enter your name and a valid email address.");
  user={name,email};
  localStorage.setItem("es_user",JSON.stringify(user));
  closeLogin();
  render();
 } catch(err) {
  let msg=document.getElementById("loginerror");
  if(!msg){msg=document.createElement("p");msg.id="loginerror";msg.style.color="#c53c3c";document.querySelector("#loginform").append(msg);}
  msg.textContent=err.message || "Login failed. Please try again.";
 }
}
function logout(){user=null;localStorage.removeItem("es_user");tab="home";render()}
function go(t){tab=t;activeTest=null;document.querySelector("#sidebar").classList.remove("open");render()}
function nav(){document.querySelector("#nav").innerHTML=navItems.filter(n=>n[0]!=="admin"||isAdmin()).map(n=>`<button class="${tab===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join("")}
function head(title,sub){return `<div class="pagehead"><h1>${title}</h1><p>${sub}</p></div>`}
function empty(t){return `<div class="empty">${t}</div>`}
function cardList(items,tag,button){return items.length?`<div class="cards">${items.map((x,i)=>`<article class="card"><span class="tag">${tag}</span><h3>${esc(x.title)}</h3><p>${esc(x.description||"")}</p>${button(x,i)}</article>`).join("")}</div>`:empty("No content published yet. Please check again soon.")}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){nav();document.querySelector("#userlabel").textContent=user?`${user.name} · ${isAdmin()?"Admin":"Student"}`:"Guest student";document.querySelector("#loginbtn").textContent=user?"Switch Student":"Student Login";
let c=document.querySelector("#content"), results=data.results.filter(r=>user&&r.email===user.email);
if(tab==="home"){c.innerHTML=`<section class="hero"><div><div class="eyebrow">YOUR LEARNING JOURNEY</div><h1>Learn today.<br><span>Lead tomorrow.</span></h1><p>Prepare smarter for Assam competitive examinations.</p><button class="btn gold" onclick="go('tests')">Explore mock tests →</button></div><div class="cap">🎓</div></section><div class="stats"><div class="stat"><strong>${data.tests.length}</strong><small>Available Mock Tests</small></div><div class="stat"><strong>${data.ebooks.length}</strong><small>Ebooks & Notes</small></div><div class="stat"><strong>${results.length}</strong><small>My Test Attempts</small></div><div class="stat"><strong>${results.length?Math.round(results.reduce((a,r)=>a+r.score,0)/results.length)+"%":"—"}</strong><small>Average Score</small></div></div><h2 class="section">Learning resources</h2><div class="tiles">${navItems.slice(1,6).map(n=>`<button class="tile" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}<small>Explore now →</small></button>`).join("")}</div>`}
if(tab==="classes")c.innerHTML=head("Online Classes","Recorded lessons and courses")+cardList(data.classes,"VIDEO LESSON",x=>`<a class="btn" target="_blank" rel="noopener" href="${esc(x.url)}">Watch class ↗</a>`);
if(tab==="ebooks")c.innerHTML=head("Ebooks & PDF Notes","Study material for your preparation")+cardList(data.ebooks,"PDF / EBOOK",x=>`<a class="btn" target="_blank" rel="noopener" href="${esc(x.url)}">Open PDF ↗</a>`);
if(tab==="live")c.innerHTML=head("Live Classes","Join scheduled live sessions")+cardList(data.live,"LIVE SESSION",x=>`<p>${esc(x.time)}</p><a class="btn" target="_blank" rel="noopener" href="${esc(x.url)}">Join class ↗</a>`);
if(tab==="tests"){if(activeTest){c.innerHTML=head(activeTest.title,"Choose one answer for each question")+activeTest.questions.map((q,i)=>`<div class="question"><b>Q${i+1}. ${esc(q.text)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" ${answers[i]===j?"checked":""} onchange="answers[${i}]=${j}">${esc(o)}</label>`).join("")}</div>`).join("")+`<button class="btn" onclick="submitTest()">Submit test</button>`}else c.innerHTML=head("Mock Tests","Attempt a test and check your score")+cardList(data.tests,"PRACTICE TEST",x=>`<button class="btn" onclick="startTest('${x.id}')">Start test →</button>`)}
if(tab==="results")c.innerHTML=head("My Results","Your mock test performance")+(results.length?results.slice().reverse().map(r=>`<div class="result"><div><b>${esc(r.title)}</b><small>${r.correct}/${r.total} correct answers</small></div><strong>${r.score}%</strong></div>`).join(""):empty("You have not attempted any tests yet."));
if(tab==="admin"){if(!isAdmin()){c.innerHTML=empty("Admin access only. Sign in using the configured admin email in demo mode.");return}c.innerHTML=head("Admin Panel","Publish content for your students")+`<div class="panel"><form class="form" onsubmit="publish(event)"><label>Content type<select id="type" onchange="fields()"><option value="ebooks">Ebook / PDF</option><option value="classes">Recorded class</option><option value="live">Live class</option><option value="tests">Mock test</option></select></label><label>Title<input id="title" required placeholder="e.g. Assam History Mock Test 01"></label><label>Description<textarea id="desc" placeholder="Short details"></textarea></label><div id="extra"><label>PDF / Video / Meet URL<input id="url" type="url" placeholder="https://..."></label></div><button class="btn">Publish content</button><p id="msg"></p></form></div>`}
}
function startTest(id){activeTest=data.tests.find(t=>t.id===id);answers={};render()}
function submitTest(){let correct=activeTest.questions.reduce((n,q,i)=>n+(answers[i]===Number(q.answer)?1:0),0),total=activeTest.questions.length,score=Math.round(correct/total*100);data.results.push({email:user?.email||"guest",name:user?.name||"Guest",title:activeTest.title,correct,total,score,date:new Date().toISOString()});save();activeTest=null;tab="results";alert(`Your score: ${correct}/${total} (${score}%)`);render()}
function fields(){let t=document.querySelector("#type").value,e=document.querySelector("#extra");if(t==="tests"){e.innerHTML=`<div id="qs"><div class="question"><label>Question<input class="qt" required></label>${[1,2,3,4].map((n)=>`<label>Option ${n}<input class="qo" required></label>`).join("")}<label>Correct option (1-4)<select class="qa"><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div></div><button type="button" class="btn light" onclick="addQuestion()">+ Add question</button>`}else e.innerHTML=`<label>${t==="ebooks"?"PDF URL":"Video / Google Meet URL"}<input id="url" type="url" required placeholder="https://..."></label>${t==="live"?'<label>Class date & time<input id="time" placeholder="12 Nov, 7:00 PM"></label>':""}`}
function addQuestion(){let q=document.createElement("div");q.className="question";q.innerHTML=`<label>Question<input class="qt" required></label>${[1,2,3,4].map(n=>`<label>Option ${n}<input class="qo" required></label>`).join("")}<label>Correct option (1-4)<select class="qa"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><button type="button" class="btn light" onclick="this.parentElement.remove()">Remove</button>`;document.querySelector("#qs").append(q)}
function publish(e){e.preventDefault();let type=document.querySelector("#type").value,x={id:Date.now().toString(),title:document.querySelector("#title").value,description:document.querySelector("#desc").value};if(type==="tests"){x.questions=[...document.querySelectorAll("#qs .question")].map(q=>({text:q.querySelector(".qt").value,options:[...q.querySelectorAll(".qo")].map(o=>o.value),answer:Number(q.querySelector(".qa").value)-1}));if(!x.questions.length){alert("Add at least one question");return}}else{x.url=document.querySelector("#url").value;x.time=document.querySelector("#time")?.value||""}data[type].push(x);save();document.querySelector("#msg").textContent="Published on this device.";e.target.reset();fields();render()}

// Explicit event listeners improve compatibility with mobile browsers.
document.getElementById("loginbtn").addEventListener("click", openLogin);
document.getElementById("cancelLogin").addEventListener("click", closeLogin);
document.getElementById("loginform").addEventListener("submit", login);
render();
</script></body></html>
